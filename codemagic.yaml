# Codemagic builds the iOS app, because Apple's toolchain only runs on macOS
# and there is no Mac here.
#
# Two workflows, in the order they become useful:
#
#   ios-unsigned   proves the project compiles on a real Mac. Needs no Apple
#                  Developer account, no certificates, no App Store Connect.
#                  Run this first — it separates "does it build" from "is the
#                  signing set up", which are the two things that go wrong and
#                  are miserable to debug together.
#
#   ios-testflight the real one. Needs the $99/year Apple Developer Program,
#                  an App Store Connect API key, and a bundle id registered
#                  against it. Commented out until those exist, because a
#                  workflow that cannot possibly succeed is just a red build.
#
# The web assets are not in git — `ios/App/App/public` is gitignored, as is
# `ios/capacitor-cordova-ios-plugins`. Both are regenerated by `cap sync`,
# which is why every workflow builds the web app first and syncs second.

workflows:
  ios-unsigned:
    name: iOS build (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22.22.0
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build the web app
        script: npm run build

      # Copies `dist` into the Xcode project and regenerates the plugin
      # packages — including the Cordova purchase plugin, whose iOS sources are
      # deliberately not committed.
      - name: Sync Capacitor iOS
        script: npx cap sync ios

      # Signing is switched off rather than faked. The point of this workflow
      # is the compile: Swift packages resolve, the plugins link, the bundle id
      # is right. Anything about certificates belongs in the workflow below.
      - name: Build unsigned .app
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
    artifacts:
      - build/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

  # ─────────────────────────────────────────────────────────────────────────
  # Uncomment once the Apple Developer Program membership exists.
  #
  # Before it will run you need, in Codemagic → Teams → Integrations:
  #   · an App Store Connect API key (Issuer ID, Key ID, .p8 private key)
  #   · the bundle id com.vedant.strata registered in your Apple developer
  #     account, with the App Store Connect app record created
  #
  # `xcode-project use-profiles` fetches and installs the signing certificate
  # and provisioning profile that the key entitles you to, so no .p12 or
  # .mobileprovision ever has to be uploaded by hand.
  # ─────────────────────────────────────────────────────────────────────────
